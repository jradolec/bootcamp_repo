# Secure-by-default Squid configuration for containerized Chainguard Squid.
# This proxy is intentionally NOT an open proxy: only RFC1918 private source
# networks are allowed, and every other client is denied by the final rule.

# Listen on Squid's default proxy port.
http_port 3128

# RFC1918 private networks allowed by default. Adjust or replace these ACLs for
# your production network policy before exposing the proxy beyond local testing.
acl private_rfc1918 src 10.0.0.0/8
acl private_rfc1918 src 172.16.0.0/12
acl private_rfc1918 src 192.168.0.0/16

# Ports considered safe for plain HTTP proxying. Requests to other destination
# ports are denied before any allow rules are evaluated.
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http

# CONNECT is restricted to SSL/TLS ports only.
acl SSL_ports port 443
acl SSL_ports port 563          # snews
acl CONNECT method CONNECT

# Basic hardening: block unsafe destination ports and non-SSL CONNECT tunnels.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Deny cache manager access unless you explicitly add authenticated admin rules.
http_access deny manager

# Allow only private RFC1918 client networks by default.
http_access allow private_rfc1918

# Deny everything else to avoid open proxy behavior.
http_access deny all

# Container observability: write logs to stdout/stderr and disable rotation.
logfile_rotate 0
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log stdio:/dev/stdout

# Avoid persistent disk cache state in the container image/layer.
cache deny all
